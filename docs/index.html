<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countiles: U.S. county tiles</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  #map { background: #f5f6f8; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: #1f2933; }
  .panel { background: rgba(255, 255, 255, 0.95); padding: 10px 12px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
  .panel h1 { font-size: 16px; margin: 0 0 2px; }
  .panel p { margin: 0 0 8px; color: #52606d; max-width: 250px; }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #7b8794; margin: 8px 0 2px; }
  .panel label { display: block; cursor: pointer; }
  #info { min-width: 210px; }
  #info table { border-collapse: collapse; }
  #info th { text-align: left; font-weight: normal; color: #7b8794; padding: 1px 12px 1px 0; }
  #info td { font-weight: 600; padding: 1px 0; }
  #legend .bar { height: 10px; width: 190px; border: 1px solid #9aa5b1; }
  #legend .ends { display: flex; justify-content: space-between; font-size: 12px; }
  .muted { color: #7b8794; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Counties, countiles and three example layers. The data files are in data/.

// Border lines: change these to restyle the map
const COUNTILE_BORDER_COLOR = '#66727f';
const COUNTILE_BORDER_WIDTH = 0.25;      // pixels
const COUNTY_BORDER_COLOR = '#000000';
const COUNTY_BORDER_WIDTH = 1.8;        // pixels
const HIGHLIGHT_COLOR = '#d7263d';      // outline of the countile (or county) under the mouse
const HIGHLIGHT_WIDTH = 2.5;            // pixels

// From bottom to top: the picture of a gridded product, the colored shapes
// (which also answer to the mouse), the countile borders, the county borders and
// the outline of the shape under the mouse.
const map = L.map('map', { zoomSnap: 0.5, minZoom: 4, maxZoom: 11, attributionControl: false }).setView([39, -97], 5);
const pane = (name, z, mouse) => {
  const p = map.createPane(name);
  p.style.zIndex = z;
  if (!mouse) p.style.pointerEvents = 'none';
  return L.canvas({ pane: name });
};
map.createPane('grid').style.zIndex = 350;
const fills = pane('fills', 400, true), tileLines = pane('tileLines', 410, false), countyLines = pane('countyLines', 420, false),
  outline = pane('outline', 430, false);

const control = (position, html) => {
  const c = L.control({ position });
  c.onAdd = () => { const d = L.DomUtil.create('div', 'panel'); d.innerHTML = html; L.DomEvent.disableClickPropagation(d); return d; };
  return c.addTo(map);
};
control('topright', `
  <h1>Countiles</h1>
  <p>U.S. counties divided into tiles of about 15 &times; 15 miles that add up to the county.</p>
  <h2>Show</h2>
  <div id="show"><label><input type="radio" name="show" value="" checked> Borders only</label></div>
  <div id="units" hidden>
    <h2>Summarized by</h2>
    <label><input type="radio" name="unit" value="county"> County</label>
    <label><input type="radio" name="unit" value="tile" checked> Countile</label>
    <label><input type="radio" name="unit" value="grid"> Grid (800 m)</label>
  </div>
  <div id="legend" hidden><h2 id="legend-title"></h2><div class="bar"></div><div class="ends"><span></span><span></span></div></div>`);
control('bottomleft', '<div id="info"><span class="muted">Hover over the map</span></div>');
const $ = id => document.getElementById(id);

const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
function color(layer, value) {
  if (!Number.isFinite(value)) return '#dddddd';
  const t = Math.min(1, Math.max(0, (value - layer.min) / (layer.max - layer.min))) * (layer.colors.length - 1);
  const i = Math.min(layer.colors.length - 2, Math.floor(t));
  return `rgb(${mix(rgb(layer.colors[i]), rgb(layer.colors[i + 1]), t - i).join(',')})`;
}
const write = (layer, value) => Number.isFinite(value) ? `${value.toFixed(layer.digits)} ${layer.units}` : 'no data';

Promise.all(['data/layers.json', 'data/counties.geojson', 'data/countiles.geojson'].map(u => fetch(u).then(r => r.json())))
  .then(([layers, countyData, tileData]) => {
    let shown = null, unit = 'tile';              // the layer on display and what it is summarized by
    const highlight = L.geoJSON(null, { renderer: outline, interactive: false, fill: false, color: HIGHLIGHT_COLOR, weight: HIGHLIGHT_WIDTH }).addTo(map);
    const hover = e => {
      const f = e.target.feature, p = f.properties, isTile = 'id' in p;
      highlight.clearLayers();
      highlight.addData(f);
      const rows = [['State', p.state_name], ['County', `${p.county} (${p.fips})`]];
      if (isTile) rows.push(['Countile', `${p.id} (${p.tile} of ${p.tiles_in_county})`], ['Area', `${p.area_km2.toFixed(0)} km&sup2;`]);
      else rows.push(['Countiles', p.tiles]);
      if (shown && unit !== 'grid') rows.push([shown.label, write(shown, p[shown.name])]);
      $('info').innerHTML = `<table>${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table>`;
    };
    map.on('mouseout', () => highlight.clearLayers());
    const shapes = data => L.geoJSON(data, { renderer: fills, stroke: false, fillOpacity: 0, onEachFeature: (f, l) => l.on('mouseover', hover) });
    const tileFill = shapes(tileData), countyFill = shapes(countyData);
    L.geoJSON(tileData, { renderer: tileLines, interactive: false, fill: false, color: COUNTILE_BORDER_COLOR, weight: COUNTILE_BORDER_WIDTH }).addTo(map);
    L.geoJSON(countyData, { renderer: countyLines, interactive: false, fill: false, color: COUNTY_BORDER_COLOR, weight: COUNTY_BORDER_WIDTH }).addTo(map);
    const pictures = Object.fromEntries(layers.map(l => [l.name, L.imageOverlay(l.image, l.bounds, { pane: 'grid', opacity: 0.9 })]));

    function paint() {
      // one set of colored shapes at a time: counties when summarized by county, countiles otherwise
      const byCounty = Boolean(shown) && unit === 'county', top = byCounty ? countyFill : tileFill;
      (byCounty ? tileFill : countyFill).remove();
      top.addTo(map);
      top.setStyle(f => ({ fillColor: shown ? color(shown, f.properties[shown.name]) : '#ffffff', fillOpacity: shown && unit !== 'grid' ? 0.9 : 0 }));
      Object.values(pictures).forEach(p => p.remove());
      if (shown && unit === 'grid') pictures[shown.name].addTo(map);
      $('units').hidden = $('legend').hidden = !shown;
      if (shown) {
        $('legend-title').textContent = `${shown.label} (${shown.units})`;
        $('legend').querySelector('.bar').style.background = `linear-gradient(to right, ${shown.colors.join(',')})`;
        const [lo, hi] = $('legend').querySelectorAll('.ends span');
        lo.textContent = shown.min.toFixed(shown.digits); hi.textContent = shown.max.toFixed(shown.digits);
      }
    }
    for (const l of layers) {
      $('show').insertAdjacentHTML('beforeend', `<label><input type="radio" name="show" value="${l.name}"> ${l.label}</label>`);
    }
    document.querySelectorAll('input[name=show]').forEach(i => i.onchange = () => { shown = layers.find(l => l.name === i.value) ?? null; paint(); });
    document.querySelectorAll('input[name=unit]').forEach(i => i.onchange = () => { unit = i.value; paint(); });
    paint();
  });
</script>
</body>
</html>
